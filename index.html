<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg0:#0b0717; --bg1:#190f33; --bg2:#2a1758;
    --gold:#e9c46a; --gold2:#f4d58d; --ink:#f3eefe; --muted:#b6a9d9;
    --card:rgba(255,255,255,.06); --line:rgba(233,196,106,.35);
    --mok:#3fb27f; --hwa:#e76f6f; --to:#e0b04a; --geum:#dfe3ea; --su:#5b8cff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR',sans-serif; color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%, #2a1758 0%, var(--bg1) 45%, var(--bg0) 100%);
    min-height:100vh; overflow-x:hidden;
  }
  .stars{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .stars i{position:absolute; width:2px;height:2px; background:#fff; border-radius:50%; opacity:.7; animation:tw 3s infinite ease-in-out;}
  @keyframes tw{0%,100%{opacity:.15; transform:scale(.6)}50%{opacity:.9; transform:scale(1.1)}}
  .wrap{position:relative; z-index:1; max-width:480px; margin:0 auto; padding:28px 20px 60px; min-height:100vh;}

  .serif{font-family:'Gowun Batang',serif;}
  .hero{text-align:center; padding:34px 0 10px;}
  .moon{font-size:60.5px; filter:drop-shadow(0 0 18px rgba(244,213,141,.55)); animation:float 5s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hero h1{font-family:'Gowun Batang',serif; font-size:33.5px; margin:10px 0 6px; letter-spacing:1px;}
  .hero h1 b{color:var(--gold2);}
  .hero p{color:var(--muted); font-size:15.5px; margin:0; line-height:1.6;}
  .tagline{display:inline-block; margin-top:14px; font-size:13.5px; color:var(--gold); border:1px solid var(--line); padding:6px 14px; border-radius:999px; background:rgba(233,196,106,.07);}

  .card{background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:22px; padding:22px; margin-top:22px; backdrop-filter:blur(8px); box-shadow:0 18px 50px rgba(0,0,0,.35);}
  label{display:block; font-size:14.5px; color:var(--muted); margin:16px 0 8px; font-weight:500;}
  label:first-child{margin-top:0;}
  input,select{
    width:100%; padding:14px 16px; border-radius:13px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05); color:var(--ink); font-size:18px; font-family:inherit; outline:none; transition:.2s;
  }
  input:focus,select:focus{border-color:var(--gold); background:rgba(233,196,106,.06);}
  input::placeholder{color:#7c719c;}
  select option{background:#1c1238; color:#fff;}
  .row{display:flex; gap:10px;}
  .row>div{flex:1;}
  .seg{display:flex; gap:8px; margin-top:8px;}
  .seg button{flex:1; padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:var(--muted); font-family:inherit; font-size:15.5px; font-weight:500; cursor:pointer; transition:.18s;}
  .seg button.on{background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#231431; border-color:transparent; font-weight:700;}
  .hint{font-size:12.5px; color:#8b7fb0; margin-top:7px; line-height:1.5;}
  .cta{
    width:100%; margin-top:24px; padding:17px; border:none; border-radius:15px; cursor:pointer;
    font-family:'Gowun Batang',serif; font-size:20px; font-weight:700; letter-spacing:1px; color:#231431;
    background:linear-gradient(135deg,#f4d58d,#e9c46a 60%,#cda044); box-shadow:0 12px 30px rgba(233,196,106,.32); transition:.2s;
  }
  .cta:active{transform:translateY(2px);}
  .cta[disabled]{opacity:.5;}

  /* loading */
  .loading{display:none; text-align:center; padding:70px 0;}
  .loading.show{display:block;}
  .spin{width:74px;height:74px; margin:0 auto 22px; border-radius:50%; border:3px solid rgba(233,196,106,.18); border-top-color:var(--gold); animation:rot 1s linear infinite;}
  @keyframes rot{to{transform:rotate(360deg)}}
  .loading p{font-family:'Gowun Batang',serif; font-size:19px; color:var(--gold2); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* result */
  #result{display:none;}
  #result.show{display:block; animation:rise .6s ease both;}
  @keyframes rise{from{opacity:0; transform:translateY(24px)}to{opacity:1; transform:none}}
  .reveal{opacity:0; transform:translateY(16px); animation:rise .55s ease forwards;}

  .rcard{background:linear-gradient(160deg,rgba(42,23,88,.85),rgba(15,9,30,.92)); border:1px solid var(--line); border-radius:24px; padding:26px 22px; box-shadow:0 20px 60px rgba(0,0,0,.5); position:relative; overflow:hidden;}
  .rcard::before{content:""; position:absolute; top:-40%; right:-30%; width:240px;height:240px; background:radial-gradient(circle,rgba(244,213,141,.16),transparent 70%); pointer-events:none;}
  .rhead{text-align:center; margin-bottom:6px;}
  .rhead .who{font-size:14.5px; color:var(--gold); letter-spacing:1px;}
  .rhead h2{font-family:'Gowun Batang',serif; font-size:28px; margin:8px 0 4px;}
  .rhead .sub{color:var(--muted); font-size:14.5px;}

  .mascot{text-align:center; margin:20px 0 8px;}
  .mascot .orb{width:128px;height:128px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; box-shadow:0 12px 34px rgba(0,0,0,.4), inset 0 0 30px rgba(255,255,255,.18); animation:float 4s ease-in-out infinite;}
  .mascot .orb::after{content:""; position:absolute; inset:-6px; border-radius:50%; border:1.5px dashed rgba(255,255,255,.45); animation:rot 16s linear infinite;}
  .mascot .orb .em{font-size:74px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.3)); line-height:1;}
  .mascot .cname{font-family:'Gowun Batang',serif; font-size:23.5px; margin-top:14px; color:var(--gold2); font-weight:700;}
  .mascot .ctrait{font-size:14.5px; color:#ddd5f5; margin-top:5px;}
  .mascot .badges{display:flex; gap:8px; justify-content:center; margin-top:13px; flex-wrap:wrap;}
  .mascot .badges span{font-size:13.5px; padding:7px 13px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);}
  .mascot .badges .star{background:rgba(91,140,255,.16); border-color:rgba(91,140,255,.35);}

  .saju{margin:22px 0 6px;}
  .saju-title{font-size:13.5px; color:var(--gold); text-align:center; letter-spacing:3px; margin-bottom:12px;}
  .pillars{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .pill{text-align:center;}
  .pill .plabel{font-size:12.5px; color:var(--muted); margin-bottom:6px;}
  .gz{border-radius:12px; padding:10px 4px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04);}
  .gz .ch{font-family:'Gowun Batang',serif; font-size:29px; line-height:1.15; font-weight:700;}
  .gz .kr{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .pill.me .gz{border-color:var(--gold); background:rgba(233,196,106,.12); box-shadow:0 0 16px rgba(233,196,106,.2);}
  .pill.me .plabel{color:var(--gold2); font-weight:700;}
  .el-목{color:var(--mok)} .el-화{color:var(--hwa)} .el-토{color:var(--to)} .el-금{color:var(--geum)} .el-수{color:var(--su)}

  .ilgan-box{margin-top:20px; text-align:center; padding:18px; border-radius:16px; background:rgba(233,196,106,.06); border:1px solid rgba(233,196,106,.18);}
  .ilgan-box .nick{font-family:'Gowun Batang',serif; font-size:24.5px; color:var(--gold2);}
  .ilgan-box .kw{margin-top:10px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap;}
  .ilgan-box .kw span{font-size:13.5px; background:rgba(255,255,255,.08); padding:5px 11px; border-radius:999px; color:var(--ink);}
  .ilgan-box .desc{margin-top:14px; font-size:15.5px; line-height:1.75; color:#e7e0fa; text-align:left;}

  .oheng{margin-top:22px;}
  .sec-t{font-family:'Gowun Batang',serif; font-size:18px; color:var(--gold2); margin:0 0 14px; display:flex; align-items:center; gap:8px;}
  .sec-t::before{content:""; width:5px; height:16px; background:var(--gold); border-radius:3px; display:inline-block;}
  .bars{display:flex; flex-direction:column; gap:9px;}
  .bar-row{display:flex; align-items:center; gap:10px; font-size:14.5px;}
  .bar-row .nm{width:30px; font-weight:700;}
  .bar-track{flex:1; height:9px; background:rgba(255,255,255,.07); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:6px; width:0; transition:width 1s cubic-bezier(.4,0,.2,1);}
  .bar-row .vv{width:26px; text-align:right; color:var(--muted); font-size:13.5px;}

  .scores{margin-top:24px; display:flex; flex-direction:column; gap:16px;}
  .score-item .sl{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
  .score-item .sl .l{font-size:15.5px; font-weight:700;}
  .score-item .sl .l small{color:var(--muted); font-weight:400; font-size:12.5px; margin-left:5px;}
  .score-item .sl .n{font-family:'Gowun Batang',serif; font-size:19px; color:var(--gold2);}
  .gauge{height:8px; background:rgba(255,255,255,.07); border-radius:6px; overflow:hidden;}
  .gauge i{display:block; height:100%; width:0; border-radius:6px; background:linear-gradient(90deg,#e9c46a,#f4d58d); transition:width 1.1s cubic-bezier(.4,0,.2,1);}
  .score-item .txt{font-size:14.5px; color:#ddd5f5; line-height:1.7; margin-top:9px;}

  .lucky{margin-top:24px; display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .lk{border-radius:15px; padding:15px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04); text-align:center;}
  .lk .lt{font-size:12.5px; color:var(--muted); letter-spacing:1px;}
  .lk .lv{font-family:'Gowun Batang',serif; font-size:20px; margin-top:7px; font-weight:700;}
  .lk.wide{grid-column:1/3;}
  .swatch{width:26px;height:26px; border-radius:50%; display:inline-block; vertical-align:middle; margin-right:8px; border:2px solid rgba(255,255,255,.5); box-shadow:0 0 12px rgba(255,255,255,.25);}
  .lk .ldesc{font-size:13px; color:#bdb2dd; margin-top:8px; line-height:1.6;}

  .month-box{margin-top:24px; border-radius:18px; padding:20px; background:linear-gradient(135deg,rgba(91,140,255,.14),rgba(233,196,106,.1)); border:1px solid rgba(255,255,255,.12);}
  .month-box .mt{font-size:13.5px; color:var(--gold); letter-spacing:2px; text-align:center;}
  .month-grid{margin-top:14px; display:flex; flex-direction:column; gap:14px;}
  .mrow{display:flex; align-items:center; gap:14px;}
  .mrow .ic{font-size:33.5px; line-height:1; flex-shrink:0; width:40px; text-align:center;}
  .mrow .mc h4{margin:0 0 3px; font-size:17px; font-family:'Gowun Batang',serif;}
  .mrow .mc p{margin:0; font-size:14px; color:#cfc6ec; line-height:1.6;}

  .oneliner{margin-top:24px; text-align:center; padding:22px 18px; border-radius:18px; background:rgba(0,0,0,.25); border:1px dashed var(--line);}
  .oneliner .q{font-size:14.5px; color:var(--gold); letter-spacing:2px; margin-bottom:10px;}
  .oneliner .msg{font-family:'Gowun Batang',serif; font-size:21.5px; line-height:1.7; color:#fff;}

  .brand{margin-top:22px; text-align:center; font-size:12.5px; color:#7c719c; letter-spacing:1px;}

  /* 모드 탭 */
  .tabs{display:flex; gap:8px; background:rgba(255,255,255,.05); padding:6px; border-radius:14px; margin-bottom:18px;}
  .tabs button{flex:1; padding:12px 6px; border:none; border-radius:10px; background:transparent; color:var(--muted); font-family:'Gowun Batang',serif; font-size:16px; font-weight:700; cursor:pointer; transition:.18s; white-space:nowrap;}
  .tabs button.on{background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#231431;}
  .personB{margin-top:20px; padding-top:18px; border-top:1px dashed rgba(233,196,106,.25);}
  .personB .pb-title{font-family:'Gowun Batang',serif; font-size:17px; color:var(--gold2); margin-bottom:4px;}

  /* 별명 배너 */
  .nick-banner{margin:18px 0 4px; text-align:center; padding:20px 16px; border-radius:18px; background:linear-gradient(135deg,rgba(233,196,106,.16),rgba(231,111,111,.12)); border:1px solid rgba(233,196,106,.3);}
  .nick-banner .nl{font-size:12.5px; color:var(--gold); letter-spacing:2px;}
  .nick-banner .nt{font-family:'Gowun Batang',serif; font-size:27px; font-weight:700; color:#fff; margin:9px 0 6px; line-height:1.35;}
  .nick-banner .ns{font-size:14.5px; color:#e7e0fa;}

  /* 전생 */
  .pastlife{margin-top:24px; border-radius:18px; padding:22px; background:linear-gradient(160deg,rgba(91,140,255,.12),rgba(42,23,88,.4)); border:1px solid rgba(255,255,255,.1);}
  .pastlife .pst{font-size:13.5px; color:var(--gold); letter-spacing:2px; text-align:center;}
  .pastlife .pman{font-family:'Gowun Batang',serif; font-size:23.5px; text-align:center; margin:12px 0; color:var(--gold2); line-height:1.45;}
  .pastlife .pemo{font-size:47px; text-align:center; display:block; margin-bottom:6px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .pastlife p{font-size:15px; line-height:1.8; color:#ddd5f5; margin:8px 0 0; text-align:center;}

  /* 닮은 인물 */
  .famous{margin-top:24px;}
  .famous .fchips{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .fchip{display:flex; align-items:center; gap:13px; padding:14px 16px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);}
  .fchip .fe{font-size:29px;}
  .fchip .fn{font-family:'Gowun Batang',serif; font-size:18px; font-weight:700;}
  .fchip .ft{font-size:13.5px; color:var(--muted); margin-top:2px;}
  .famous .fdis{font-size:12.5px; color:#8b7fb0; text-align:center; margin-top:10px;}

  /* 프리미엄 잠금 */
  .premium{margin-top:26px; border-radius:20px; padding:24px 20px; background:linear-gradient(160deg,#2a1758,#160c30); border:1.5px solid var(--gold); position:relative; overflow:hidden;}
  .premium .pm-tag{display:inline-block; font-size:12.5px; color:#231431; background:linear-gradient(135deg,var(--gold),var(--gold2)); padding:5px 12px; border-radius:999px; font-weight:700; letter-spacing:1px;}
  .premium h3{font-family:'Gowun Batang',serif; font-size:23.5px; margin:14px 0 6px; color:#fff;}
  .premium .pm-sub{font-size:14.5px; color:var(--muted); line-height:1.6;}
  .pm-teaser{margin-top:18px; position:relative;}
  .pm-list{display:flex; flex-direction:column; gap:11px; filter:blur(5px); opacity:.7; pointer-events:none; user-select:none;}
  .pm-row{display:flex; gap:10px; align-items:center; font-size:14.5px; padding:11px 14px; border-radius:11px; background:rgba(255,255,255,.05);}
  .pm-row .pm-m{color:var(--gold2); font-weight:700; min-width:42px;}
  .pm-lock-overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;}
  .pm-lock-overlay .lock{font-size:38px;}
  .pm-lock-overlay .lt{font-size:14.5px; color:var(--ink);}
  .pm-cta{width:100%; margin-top:18px; padding:17px; border:none; border-radius:14px; cursor:pointer; font-family:'Gowun Batang',serif; font-size:19px; font-weight:700; color:#231431; background:linear-gradient(135deg,#f4d58d,#e9c46a 60%,#cda044); box-shadow:0 10px 26px rgba(233,196,106,.32);}
  .pm-cta:active{transform:translateY(2px);}
  .pm-note{font-size:12.5px; color:#8b7fb0; text-align:center; margin-top:10px; line-height:1.5;}
  .pm-unlocked .pm-list{filter:none; opacity:1; pointer-events:auto;}
  .pm-unlocked .pm-lock-overlay,.pm-unlocked .pm-cta,.pm-unlocked .pm-note{display:none;}
  .pm-fore{margin-top:16px;}
  .pm-fore .pm-omen{padding:14px 16px; border-radius:12px; background:rgba(91,140,255,.12); border:1px solid rgba(91,140,255,.3); font-size:15px; line-height:1.7; color:#e7e0fa; margin-bottom:10px;}
  .pm-sec-t{font-family:'Gowun Batang',serif; font-size:17px; color:var(--gold2); margin:20px 0 11px; font-weight:700;}
  .pm-months{display:flex; flex-direction:column; gap:9px; margin-bottom:4px;}
  .pm-mrow{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:11px; background:rgba(255,255,255,.05);}
  .pm-mrow .pm-m{color:var(--gold2); font-weight:700; min-width:58px; font-size:14.5px;}
  .pm-mrow .pm-mt{font-size:14.5px; line-height:1.55; color:#e7e0fa;}
  .pm-flows{display:flex; flex-direction:column; gap:10px;}
  .pm-flow{padding:14px 16px; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);}
  .pm-flow .pm-fh{font-size:15.5px; font-weight:700; color:var(--gold2); margin-bottom:5px;}
  .pm-flow .pm-ft{font-size:14.5px; line-height:1.7; color:#ddd5f5;}

  /* 궁합 */
  .compat-top{display:flex; align-items:center; justify-content:center; gap:6px; margin:18px 0;}
  .compat-top .cp{text-align:center; flex:1;}
  .compat-top .cp .orb2{width:84px;height:84px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 0 20px rgba(255,255,255,.16);}
  .compat-top .cp .orb2 .em{font-size:47px;}
  .compat-top .cp .cnm{font-size:14.5px; margin-top:8px; font-weight:700;}
  .compat-top .cp .czd{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .compat-top .vs{font-family:'Gowun Batang',serif; font-size:24.5px; color:var(--gold); flex-shrink:0;}
  .compat-score{text-align:center; margin:6px 0 18px;}
  .compat-score .big{font-family:'Gowun Batang',serif; font-size:60.5px; font-weight:700; background:linear-gradient(135deg,#f4d58d,#e76f6f); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; line-height:1;}
  .compat-score .lbl{font-family:'Gowun Batang',serif; font-size:21.5px; color:#fff; margin-top:8px;}
  .heart-track{height:12px; background:rgba(255,255,255,.08); border-radius:8px; overflow:hidden; margin:16px 0;}

  const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;

  const beforeIpchun = (m<2) || (m===2 && d<4);
  const effYear = beforeIpchun ? y-1 : y;

  // 년주
  const yStem = ((effYear-4)%10+10)%10;
  const yBranch = ((effYear-4)%12+12)%12;

  // 월주 (지지)
  let mBranch;
  if(d >= TERM_DAY[m]) mBranch = NEW_BRANCH[m];
  else { const pm = m===1?12:m-1; mBranch = NEW_BRANCH[pm]; }
  // 월간 (五虎遁): 인월 천간 = (년간%5)*2+2
  const yinStem = ((yStem%5)*2+2)%10;
  const monthOrder = ((mBranch-2)%12+12)%12; // 인=0 기준
  const mStem = (yinStem+monthOrder)%10;

  // 일주
  const J = jdn(y,m,d);
  const dayIdx = ((J+49)%60+60)%60; // 0=甲子
  const dStem = dayIdx%10, dBranch = dayIdx%12;

  // 시주
  let hStem=null, hBranch=null;
  if(hourBranch!==null){
    hBranch = Math.floor(((hourBranch+1)%24)/2)%12; // 0..22 입력 -> 지지
    const ziStem = ((dStem%5)*2)%10; // 五鼠遁: 자시 천간
    hStem = (ziStem+hBranch)%10;
  }

  // 오행 집계
  const el = {목:0,화:0,토:0,금:0,수:0};
  el[HS_EL[yStem]]++; el[EB_EL[yBranch]]++;
  el[HS_EL[mStem]]++; el[EB_EL[mBranch]]++;
  el[HS_EL[dStem]]++; el[EB_EL[dBranch]]++;
  if(hStem!==null){ el[HS_EL[hStem]]++; el[EB_EL[hBranch]]++; }

  return {
    effYear, beforeIpchun,
    year:{s:yStem,b:yBranch}, month:{s:mStem,b:mBranch},
    day:{s:dStem,b:dBranch}, hour:hStem===null?null:{s:hStem,b:hBranch},
    dStem, dBranch, yBranch, el,
    hasHour: hStem!==null
  };
}

  const role=PAST_ROLE[dayEl][Math.floor(r()*PAST_ROLE[dayEl].length)];

const CHUNG=[[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];
function pairIn(list,a,b){ return list.some(g=>g.includes(a)&&g.includes(b)); }
function zodiacYears(branch){ const out=[]; for(let y=2025;y>=1948&&out.length<4;y--){ if(((y-4)%12+12)%12===branch) out.push(y); } return out.join('·')+'년생'; }
function zodiacMatch(branch){
  let yuk=null;
  for(const [a,b] of YUKHAP){ if(a===branch)yuk=b; else if(b===branch)yuk=a; }
  let sam=[];
  for(const g of SAMHAP){ if(g.includes(branch)) sam=g.filter(x=>x!==branch); }
  let chung=null;
  for(const [a,b] of CHUNG){ if(a===branch)chung=b; else if(b===branch)chung=a; }

}
function elRel(a,b){

}

function hasJong(s){ if(!s) return false; const c=s.charCodeAt(s.length-1); return c>=0xAC00&&c<=0xD7A3 && (c-0xAC00)%28!==0; }
function pEulReul(w){ return hasJong(w)?'을':'를'; }
// 받침에 맞춰 조사(을/를·은/는·이/가)를 자동 교정 (<b>태그 사이도 처리)
function fixJosa(s){
  return s.replace(/([가-힣])(<\/b>)?(을|를|은|는|이|가)/g,(m,ch,b,p)=>{
    const j=(ch.charCodeAt(0)-0xAC00)%28!==0;
    const map={'을':['을','를'],'를':['을','를'],'은':['은','는'],'는':['은','는'],'이':['이','가'],'가':['이','가']};
    return ch+(b||'')+map[p][j?0:1];
  });
}

      neutral:['요란하진 않아도 꾸준히 곁을 지키는 진국 우정이에요. 노력한 만큼 깊어집니다.','담백하지만 오래가는 사이. 먼저 연락하는 한 명이 이 우정을 단단하게 만들어요.','시끌벅적하진 않아도 편안한 친구. 곁에 오래 두고 싶은 사람이에요.']

  };
  const label = LABELS[friend?'friend':'love'][relKey];
  const msg = pick(r, MSGS[friend?'friend':'love'][relKey]);

  // 관계 별명
  let coupleNick;
  if(friend){
    if(harmonic) coupleNick='천생 단짝 베프 👯';
    else if(er==='gen') coupleNick='서로 채워주는 성장 친구 🌱';
    else if(er==='same') coupleNick='소울메이트급 닮은꼴 친구 🍒';
    else if(er==='ctrl'||branchRel==='충') coupleNick='티격태격 정드는 애증 친구 🔥';
    else coupleNick='편하게 오래가는 무던 친구 ☕';
  } else {
    if(harmonic) coupleNick='환상의 천생연분 커플 💞';
    else if(er==='gen') coupleNick='서로를 키우는 성장 커플 🌱';
    else if(er==='same') coupleNick='찰떡같은 닮은꼴 커플 🍒';
    else if(er==='ctrl'||branchRel==='충') coupleNick='불꽃 튀는 밀당 커플 🔥';
    else coupleNick='은근히 잘 맞는 무던 커플 ☕';
  }

  // 세부 궁합 점수
  const isGen=er==='gen', isSame=er==='same', isCtrl=er==='ctrl';
  const yh=branchRel==='육합', sh=branchRel==='삼합', ch=branchRel==='충';
  function sub(bias){ return Math.max(45,Math.min(99, Math.round(score*0.55 + 22 + bias + (r()*12-6)))); }
  const subLabels = friend
    ? ['첫인상','성격 궁합','텐션 · 케미','대화 · 소통','의리 · 오래감']
    : ['첫인상 · 끌림','성격 궁합','애정 · 설렘','대화 · 소통','장기 · 결혼운'];
  const subScores=[
    {label:subLabels[0], score:sub((isCtrl?10:isGen?5:isSame?-2:-4)+(ch?6:0))},
    {label:subLabels[1], score:sub(isSame?10:isGen?5:isCtrl?-6:0)},
    {label:subLabels[2], score:sub((isGen?7:0)+(yh?6:0)+(isCtrl?5:0))},
    {label:subLabels[3], score:sub((isSame?8:0)+(yh?5:0)+(isGen?2:0)+(ch?-6:0))},
    {label:subLabels[4], score:sub((isGen?7:0)+(sh?6:0)+(yh?5:0)+((isCtrl||ch)?-9:0))}
  ];

  // 잘 맞는 점 / 조심할 점 (풀에서 매번 다른 조합 추출)
  const MERIT={
    gen:['한쪽이 지치면 다른 쪽이 끌어올려주는 환상의 호흡','서로의 부족한 부분을 자연스럽게 채워줘요','함께일수록 둘 다 더 나은 사람이 됩니다','좋은 영향을 주고받는 선순환 관계','상대의 장점을 끌어내 주는 사이','곁에 있으면 긍정 에너지가 샘솟아요'],
    same:['말 안 해도 통하는 척하면 척 케미','취향과 생활 리듬이 비슷해 편안해요','같은 곳을 바라보는 가치관','같이 있으면 내 집처럼 편안해요','텐션이 잘 맞아 함께가 즐거워요','서로를 깊이 이해하는 공감대'],
    ctrl:['강하게 끌리는 자석 같은 매력','서로 자극이 되어 지루할 틈이 없어요','부족함을 메우려 노력하며 함께 성장','상대에게서 없는 매력을 발견해요','정반대라 오히려 균형이 맞아요','다이내믹해서 권태로울 틈이 없어요'],
    neutral:['튀지 않아 오래 함께하기 편한 사이','노력한 만큼 깊어지는 진국 케미','서로의 영역을 존중하는 어른스러운 관계','무리 없이 편하게 만나는 사이','각자 알아서 잘해 부담이 없어요','시간이 쌓일수록 단단해지는 신뢰']
  };
  const CAUTION={
    gen:['한쪽이 주기만 하면 지칠 수 있어요','받은 만큼 고마움을 자주 표현하기','균형이 한쪽으로 쏠리지 않게 신경 쓰기','당연하게 여기지 말고 표현하기'],
    same:['둘 다 같은 약점 — 한 명은 중심을 잡아야 해요','비슷해서 부딪히면 서로 안 굽혀요','같은 실수를 할 수 있어 서로 점검 필요','너무 닮아 가끔 답답할 수 있어요'],
    ctrl:['욱하는 순간을 조심하세요','이기려 들면 둘 다 다쳐요 — 져주는 연습','감정이 격해질 땐 잠시 거리 두기','자존심 싸움은 둘 다 손해예요'],
    neutral:['무던함이 무관심이 되지 않게 표현을 자주','먼저 다가가는 한 걸음이 관계를 살려요','연락 텀이 길어지지 않게 챙기기','무심함이 거리감이 되지 않게 주의']
  };
  const merits=pickN(r,MERIT[er],3);

  if(ch) cautions.push('부딪힘이 잦을 수 있으니 한 박자 쉬어가기');

  // 일간 케미 + 각자 스타일
  const igA=ILGAN[A.saju.dStem], igB=ILGAN[B.saju.dStem];
  const REL_LINES={
    gen:['서로의 기운을 북돋아 함께 자라는 사이예요','한 명이 멈추면 다른 한 명이 끌어주는 환상의 조합이에요','부족한 부분을 자연스럽게 메워주는 상생의 만남이에요','곁에 있을수록 서로를 더 빛나게 하는 인연이에요','티격태격해도 결국 서로를 키워주는 관계예요'],
    same:['같은 결을 지녀 말하지 않아도 통하는 사이예요','닮은 점이 많아 신기할 만큼 편안한 만남이에요','취향도 속도도 비슷해 척하면 척 통해요','거울처럼 서로를 비추는 닮은꼴 인연이에요','같은 곳을 바라봐 발맞춰 가기 좋은 사이예요'],

  const activity=(friend?FRIEND_SPOT:DATE_SPOT)[Math.floor(r()*(friend?FRIEND_SPOT:DATE_SPOT).length)];
  const advice= friend
    ? {gen:'서로를 응원하는 지금처럼이면 평생 갈 우정이에요.',same:'너무 비슷해 가끔 부딪혀도, 그게 진짜 친구라는 증거예요.',ctrl:'투닥거려도 결국 찾게 되는 사이. 솔직함이 우정을 지켜요.',neutral:'먼저 연락하는 한 명이 이 우정을 오래 가게 만들어요.'}[er]
    : {gen:'지금처럼 서로를 아끼면 오래도록 빛날 인연이에요.',same:'비슷한 만큼, 가끔은 서로의 다름을 즐겨보세요.',ctrl:'뜨거운 만큼 식기도 쉬워요. 말로 자주 사랑을 확인하세요.',neutral:'작은 표현 하나가 이 인연을 특별하게 만듭니다.'}[er];

  // 미래 아기 — 연인 궁합에서만
  let baby=null;
  if(!friend){
    const GEN_EL={목:'화',화:'토',토:'금',금:'수',수:'목'};
    const babyCand=[elA,elB,GEN_EL[elA],GEN_EL[elB]];
    const babyEl=babyCand[Math.floor(r()*babyCand.length)];
    const bb=BABY[babyEl];
    const lookLike=r()<0.5?A.name:B.name;
    const persLike=lookLike===A.name?B.name:A.name;
    const taemyung=bb.names[Math.floor(r()*bb.names.length)];
    const bn=BABY_NAMES[babyEl];
    const boyNames=pick2(r,bn.boy), girlNames=pick2(r,bn.girl);
    baby={el:babyEl, nick:bb.nick, emo:bb.emo, temper:bb.temper, talent:bb.talent, caution:bb.caution, care:bb.care, lookLike, persLike, taemyung, boyNames, girlNames};
  }

  const detail=[];
  detail.push({t:'오행 궁합', v:`${A.name}(${elA}) · ${B.name}(${elB}) → ${er==='gen'?'상생(서로 살림) ✨':er==='same'?'비화(닮은꼴)':er==='ctrl'?'상극(끌림과 긴장) 🔥':'평이한 관계'}`});
  detail.push({t:'띠 궁합', v: branchRel==='육합'?'육합 — 찰떡같이 잘 맞는 환상의 짝 💞':branchRel==='삼합'?'삼합 — 함께하면 일이 잘 풀리는 길한 조합 🍀':branchRel==='충'?'상충 — 스파크 튀지만 정드는 사이 ⚡':'무난한 띠 조합'});
  return {relType,friend,score,label,msg,coupleNick,subScores,merits,cautions,chem,styleA,styleB,styleTitle,activity,advice,baby,detail,elA,elB};
}

/* 씨앗 기반 결정 RNG */
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
function tier(score){ return score>=70?'hi':score>=45?'mid':'lo'; }

}

}

const TAROT_ADVICE=['마음이 이끄는 직감을 한 번 믿어보세요.','오늘의 작은 선택이 내일의 큰 흐름을 만듭니다.','답을 밖에서 찾기보다 안에서 들어보세요.','지나간 것에 머물지 말고 지금에 집중하세요.','두려움보다 호기심으로 한 발 내디뎌 보세요.'];

function drawTarot(seedTxt){
  const r=mulberry32(hashStr(seedTxt+'tarot'));
  const idxs=[]; while(idxs.length<3){ const i=Math.floor(r()*TAROT.length); if(!idxs.includes(i)) idxs.push(i); }
  const pos=['과거','현재','미래'];
  const draws=idxs.map((i,k)=>({card:TAROT[i], up:r()<0.62, pos:pos[k]}));
  let tone=0; draws.forEach(d=>{ tone += d.up? d.card.p : -d.card.p; });
  const tier = tone>=2?'hi' : tone<=-1?'lo' : 'mid';
  const sum=pick(r,TAROT_SUM[tier]);
  const advice=pick(r,TAROT_ADVICE);
  return {draws, sum, advice};
}

function validPerson(name,y,m,d,err){
  if(!name){ err.textContent='이름을 입력해 주세요.'; return false; }
  if(!y||!m||!d){ err.textContent='생년월일을 모두 입력해 주세요.'; return false; }
  if(y<1900||y>2100){ err.textContent='연도를 다시 확인해 주세요.'; return false; }
  if(m<1||m>12||d<1||d>31){ err.textContent='월/일을 다시 확인해 주세요.'; return false; }
  return true;
}
function showLoading(msgs,cb){
  $('#inputView').style.display='none';
  $('#loadingView').classList.add('show');
  let mi=0; const lm=$('#loadMsg'); lm.textContent=msgs[0];
  const timer=setInterval(()=>{ mi=(mi+1)%msgs.length; lm.textContent=msgs[mi]; },650);
  setTimeout(()=>{ clearInterval(timer); $('#loadingView').classList.remove('show'); cb(); },2300);
}

/* ===== 결과 공유 (결과를 URL에 담아 같은 화면 재현) ===== */
const PROD_BASE='https://saju-fortune-ochre.vercel.app/';
function shareBase(){
  if(location.protocol==='file:'||/^(localhost|127\.|192\.168\.)/.test(location.hostname)) return PROD_BASE;
  return location.origin+location.pathname;
}
function buildShareURL(sh){
  const u=new URLSearchParams();
  Object.keys(sh).forEach(k=>{ if(sh[k]!==null&&sh[k]!==undefined&&sh[k]!=='') u.set(k,sh[k]); });
  return shareBase()+'?'+u.toString();
}
function animateBars(){
  document.querySelectorAll('.bar-fill').forEach(b=>b.style.width=b.dataset.w+'%');
  document.querySelectorAll('.gauge i').forEach(g=>g.style.width=g.dataset.w+'%');
  document.querySelectorAll('.heart-track i').forEach(g=>g.style.width=g.dataset.w+'%');
}
function mountResult(html, bindData){
  $('#inputView').style.display='none';
  $('#loadingView').classList.remove('show');
  const r=$('#result'); r.innerHTML=html; r.classList.add('show');
  window.scrollTo({top:0,behavior:'instant'});
  setTimeout(animateBars,200);
  bindResult(bindData);
}

$('#goBtn').addEventListener('click',()=>{
  const err=$('#err'); err.textContent='';

  if(mode==='tarot'){
    const q=$('#tarotQ').value.trim();
    const nm=$('#name').value.trim();
    const today=new Date();
    const dstr=`${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
    const t=drawTarot((nm||'나')+'|'+q+'|'+dstr);
    window.__share={m:'t',n:nm,q:q,dt:dstr};
    showLoading(['카드를 섞는 중…','운명의 카드를 펼치는 중…','과거·현재·미래를 읽는 중…'],
      ()=>mountResult(renderTarot(nm,q,t),{name:(nm||'타로')+'_타로'}));
    return;
  }

  const name=$('#name').value.trim();
  const y=parseInt($('#year').value,10), m=parseInt($('#month').value,10), d=parseInt($('#day').value,10);
  const hourBranch = $('#hour').value===''? null : parseInt($('#hour').value,10);
  if(!name){ err.textContent= mode==='love'?'내 이름을 입력해 주세요.':'이름을 입력해 주세요.'; return; }
  if(!state.gender){ err.textContent='성별을 선택해 주세요.'; return; }
  if(!validPerson(name,y,m,d,err)) return;
  const saju=calcSaju(y,m,d,hourBranch);
  const A={name,gender:state.gender,cal:state.cal,y,m,d,saju,hourBranch};

  if(mode==='solo'){
    window.__share={m:'s',n:A.name,g:A.gender,c:A.cal,y:A.y,o:A.m,d:A.d,h:A.hourBranch??''};
    showLoading(['사주팔자를 세우는 중…','천간과 지지를 짚는 중…','오행의 균형을 읽는 중…','오늘의 기운을 풀이하는 중…'],
      ()=>mountResult(render(A),A));
  } else {
    const bname=$('#bname').value.trim();
    const by=parseInt($('#byear').value,10), bm=parseInt($('#bmonth').value,10), bd=parseInt($('#bday').value,10);
    const bhour=$('#bhour').value===''? null : parseInt($('#bhour').value,10);
    if(!state.bGender){ err.textContent='상대방 성별을 선택해 주세요.'; return; }
    if(!bname){ err.textContent='상대 이름을 입력해 주세요.'; return; }
    if(!validPerson(bname,by,bm,bd,err)) return;
    const bsaju=calcSaju(by,bm,bd,bhour);
    const B={name:bname,gender:state.bGender,cal:'양',y:by,m:bm,d:bd,saju:bsaju,hourBranch:bhour};
    const compat=calcCompat(A,B,relType);
    window.__share={m:'l',rt:relType,n:A.name,g:A.gender,c:A.cal,y:A.y,o:A.m,d:A.d,h:A.hourBranch??'',
      n2:B.name,g2:B.gender,y2:B.y,o2:B.m,d2:B.d,h2:B.hourBranch??''};
    const loadMsgs = relType==='friend'
      ? ['두 사람의 사주를 맞춰보는 중…','우정의 케미를 살피는 중…','띠의 합과 충을 보는 중…','인연의 깊이를 재는 중…']
      : ['두 사람의 사주를 맞춰보는 중…','오행의 어울림을 살피는 중…','띠의 합과 충을 보는 중…','인연의 깊이를 재는 중…'];
    showLoading(loadMsgs,()=>mountResult(renderCompat(A,B,compat),{name:A.name+'_'+B.name+'_궁합'}));
  }
});

    }
  });
}

/* 공유 링크로 들어온 경우 → 같은 결과 재현 */
function autoRunFromURL(){
  const p=new URLSearchParams(location.search);
  const m=p.get('m'); if(!m) return;
  const hb=v=>{ const h=p.get(v); return (h===null||h==='')?null:parseInt(h,10); };
  try{
    if(m==='s'){
      if(!p.get('y')) return;
      const A={name:p.get('n')||'',gender:p.get('g')||'여',cal:p.get('c')||'양',y:+p.get('y'),m:+p.get('o'),d:+p.get('d'),hourBranch:hb('h')};
      A.saju=calcSaju(A.y,A.m,A.d,A.hourBranch);
      window.__share={m:'s',n:A.name,g:A.gender,c:A.cal,y:A.y,o:A.m,d:A.d,h:A.hourBranch??''};
      mountResult(render(A),A);
    } else if(m==='l'){
      if(!p.get('y')||!p.get('y2')) return;
      const rt=p.get('rt')||'love';
      const A={name:p.get('n')||'',gender:p.get('g')||'여',cal:p.get('c')||'양',y:+p.get('y'),m:+p.get('o'),d:+p.get('d'),hourBranch:hb('h')};
      A.saju=calcSaju(A.y,A.m,A.d,A.hourBranch);
      const B={name:p.get('n2')||'',gender:p.get('g2')||'여',cal:'양',y:+p.get('y2'),m:+p.get('o2'),d:+p.get('d2'),hourBranch:hb('h2')};
      B.saju=calcSaju(B.y,B.m,B.d,B.hourBranch);
      window.__share={m:'l',rt,n:A.name,g:A.gender,c:A.cal,y:A.y,o:A.m,d:A.d,h:A.hourBranch??'',n2:B.name,g2:B.gender,y2:B.y,o2:B.m,d2:B.d,h2:B.hourBranch??''};
      mountResult(renderCompat(A,B,calcCompat(A,B,rt)),{name:A.name+'_'+B.name+'_궁합'});
    } else if(m==='t'){
      const nm=p.get('n')||'', q=p.get('q')||'', dt=p.get('dt')||'';
      window.__share={m:'t',n:nm,q,dt};
      mountResult(renderTarot(nm,q,drawTarot((nm||'나')+'|'+q+'|'+dt)),{name:(nm||'타로')+'_타로'});
    }
  }catch(e){ /* 파라미터 오류 시 일반 입력화면 유지 */ }
}

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
</script>
